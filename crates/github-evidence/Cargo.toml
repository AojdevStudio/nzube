[package]
name = "github-evidence"
version = "0.1.0"
description = "Read-only GitHub evidence retrieval with a closed endpoint allowlist and GitHub App device-flow auth"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
